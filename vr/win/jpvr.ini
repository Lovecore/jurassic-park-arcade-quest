; jpvr settings: copy next to version.dll in TeknoParrot's ElfLdr2 folder.
; Env vars JPVR_<KEY> override these.
[jpvr]
; 1: engine VR mode (mode 2 + VidOVR stubs); 0: stock rendering
enable=1
; 1: DK2 barrel warp; 0: identity (raw side-by-side)
warp=0
; diagnostics: render-path trace, GL checks, screenshots, console mirror
diag=1
; framebuffer screenshot every N frames, at most shot_max of them
shot_every=600
shot_max=12
